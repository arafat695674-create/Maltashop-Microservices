# CI for the MaltaShop place-order prototype (one workflow, one job chain per repo).
# Third-party actions are pinned to full commit SHAs (the release tag is in the trailing comment) so a moved tag
# cannot change what runs; Dependabot (.github/dependabot.yml) proposes reviewed updates (supply-chain risk, Lecture 6).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:                        # Stage 1: gitleaks over the full history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3  # v2.3.7
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  lint-and-unit:                         # Stages 1-2: fail fast, no containers needed
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, payment-service]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with: { python-version: "3.12" }
      - run: pip install ruff -r ${{ matrix.service }}/requirements.txt -r ${{ matrix.service }}/requirements-dev.txt
      - run: ruff check ${{ matrix.service }}/app
      - run: python -m pytest -q
        working-directory: ${{ matrix.service }}
        env: { DATABASE_URL: "unused", RABBITMQ_URL: "unused", SERVICE_NAME: "${{ matrix.service }}" }

  build-and-scan:                        # Stages 3 and 5: build once, scan the image
    needs: [lint-and-unit, secret-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [order-service, inventory-service, payment-service, notification-service]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: docker build -t ${{ matrix.service }}:${{ github.sha }} ./${{ matrix.service }}
      - uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2  # v0.28.0
        with:
          image-ref: ${{ matrix.service }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: "1"                 # gate: fail the build on CRITICAL/HIGH vulnerabilities

  integration:                           # Stage 4: real broker + databases, run the end-to-end scenarios
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - run: cp .env.example .env
      - run: docker compose up --build -d --wait
      - run: python scripts/smoke_test.py
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v

  # Stage 6 (publish an immutable image and let Argo CD deploy it) is described in the report;
  # it is deliberately not implemented in this prototype.

