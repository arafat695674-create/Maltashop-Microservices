# One command starts everything:  docker compose up --build
# Each service owns its own PostgreSQL instance (database per service); services never read each other's data.
x-service-env: &common-env
  RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-db: &db
  image: postgres:16-alpine
  restart: unless-stopped
  environment: &db-env
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
    interval: 5s
    timeout: 3s
    retries: 10
  networks: [backend]

services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment: { RABBITMQ_DEFAULT_USER: "${RABBITMQ_USER}", RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS}" }
    ports: ["15672:15672"]            # management UI (local demo only)
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"], interval: 10s, timeout: 5s, retries: 10, start_period: 20s }
    networks: [backend]

  orders-db:
    <<: *db
    environment: { <<: *db-env, POSTGRES_DB: orders_db }
    volumes: [orders-data:/var/lib/postgresql/data]
  inventory-db:
    <<: *db
    environment: { <<: *db-env, POSTGRES_DB: inventory_db }
    volumes: [inventory-data:/var/lib/postgresql/data]
  payments-db:
    <<: *db
    environment: { <<: *db-env, POSTGRES_DB: payments_db }
    volumes: [payments-data:/var/lib/postgresql/data]
  notifications-db:
    <<: *db
    environment: { <<: *db-env, POSTGRES_DB: notifications_db }
    volumes: [notifications-data:/var/lib/postgresql/data]

  order-service:
    build: ./order-service
    environment: { <<: *common-env, SERVICE_NAME: order-service, DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@orders-db:5432/orders_db" }
    ports: ["8001:8000"]              # the only REST entry point used by the demo
    depends_on: { rabbitmq: { condition: service_healthy }, orders-db: { condition: service_healthy } }
    networks: [backend]
  inventory-service:
    build: ./inventory-service
    environment: { <<: *common-env, SERVICE_NAME: inventory-service, DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@inventory-db:5432/inventory_db" }
    ports: ["8002:8000"]
    depends_on: { rabbitmq: { condition: service_healthy }, inventory-db: { condition: service_healthy } }
    networks: [backend]
  payment-service:
    build: ./payment-service
    environment: { <<: *common-env, SERVICE_NAME: payment-service, DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@payments-db:5432/payments_db" }
    depends_on: { rabbitmq: { condition: service_healthy }, payments-db: { condition: service_healthy } }
    networks: [backend]
  notification-service:
    build: ./notification-service
    environment: { <<: *common-env, SERVICE_NAME: notification-service, DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@notifications-db:5432/notifications_db" }
    ports: ["8004:8000"]
    depends_on: { rabbitmq: { condition: service_healthy }, notifications-db: { condition: service_healthy } }
    networks: [backend]

networks:
  backend: {}
volumes: { rabbitmq-data: {}, orders-data: {}, inventory-data: {}, payments-data: {}, notifications-data: {} }

